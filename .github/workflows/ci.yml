name: CI

on:
  push:
    branches: [main]
  pull_request:

# Default to the minimum. Jobs that need more raise it explicitly (PRD §9.3).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Every third-party action is pinned by commit SHA. We tell customers to pin
      # (PRD §9.2); not doing it ourselves would not be credible. Re-resolve a SHA with
      # `git ls-remote --tags --refs https://github.com/<owner>/<repo>` before bumping.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm must be installed before setup-node, so setup-node's pnpm cache can find it.
      # No `version` input: the action reads `packageManager` from the root package.json.
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm

      # --ignore-scripts: never execute third-party lifecycle scripts in CI (PRD §9.5).
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Architectural constraints (PRD §4.3, §10.4)
        run: pnpm check:deps

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  self-scan:
    # Dogfood: the product must scan its own repository clean (PRD §22).
    # Enable from week 6, when the CLI exists.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npx @security-doctor/cli scan --fail-on verified
